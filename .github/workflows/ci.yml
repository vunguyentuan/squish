name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: App/.build
          key: spm-${{ runner.os }}-${{ hashFiles('App/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Engine and app tests
        run: make test

      - name: Build the app bundle
        run: make app

      - name: Check the bundle
        run: |
          test -d build/Squish.app/Contents/Resources/Metadata.appintents
          ln -sf "$PWD/build/Squish.app/Contents/MacOS/Squish" squish
          ./squish --version
